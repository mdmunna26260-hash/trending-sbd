# SINZO Commerce — VPS production stack (Dokploy-compatible, 2GB RAM tuned)
# Dokploy will manage this via its own Traefik; ports binding kept simple.
version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sinzo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: sinzo
    volumes: [pgdata:/var/lib/postgresql/data]
    # keep Postgres memory sane on a small VPS
    command: >
      postgres -c shared_buffers=128MB -c effective_cache_size=384MB
               -c maintenance_work_mem=32MB -c work_mem=4MB -c max_connections=60
    deploy:
      resources:
        limits: { memory: 512M }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinzo -d sinzo"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sinzo:${POSTGRES_PASSWORD}@db:5432/sinzo
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://sinzooffcial.com}
      NODE_ENV: production
      # order isolation: this deployment only shows/manages its own orders
      DEPLOY_CHANNEL: vps
      # Next.js memory cap inside the container (leave headroom for spikes + swap)
      NODE_OPTIONS: --max-old-space-size=768
    volumes: [uploads:/app/public/uploads]
    deploy:
      resources:
        limits: { memory: 896M }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # ── Edge rate limiting (Traefik, fronted by Dokploy) ────────────────────────
    # A limit here rejects floods BEFORE they reach Node. On an 896 MB container
    # running one Node process that is worth more than it looks: a single pegged
    # thread starves every other request, which is exactly how the sanitizeHtml()
    # tokenizer hang took the whole app down (load average 6+, all routes dead).
    #
    # This block only DEFINES the middleware. Attaching it needs the router name
    # Dokploy generated, which this file cannot know — see it in the dashboard
    # under the service → Domain → Advanced → Traefik labels, then add:
    #     traefik.http.routers.<YOUR-ROUTER-NAME>.middlewares=sinzo-ratelimit
    # While unattached it is inert, so committing this cannot break routing or TLS.
    #
    # WARNING — if the domain is proxied through Cloudflare (orange cloud on),
    # Traefik sees Cloudflare's IPs instead of visitors', so every shopper lands in
    # ONE shared bucket and a busy hour would 429 the entire store. In that case
    # either use a Cloudflare Rate Limiting rule instead (better layer anyway), or
    # first give Traefik the real client IP via forwardedHeaders.trustedIPs set to
    # Cloudflare's published ranges. The numbers below are deliberately loose so
    # this stays survivable even if that is misconfigured.
    #
    # The healthcheck above runs wget INSIDE the container, so it never traverses
    # Traefik and cannot be throttled by this.
    #
    # Tuning: average is requests/second per source IP once the burst is spent.
    # 200/500 only catches real floods. To tighten just the login surface, define a
    # second middleware (e.g. average=5, burst=20) and attach it to a router whose
    # rule matches PathPrefix(`/api/auth`) and PathPrefix(`/api/admin/login`).
    labels:
      - "traefik.http.middlewares.sinzo-ratelimit.ratelimit.average=200"
      - "traefik.http.middlewares.sinzo-ratelimit.ratelimit.burst=500"
      - "traefik.http.middlewares.sinzo-ratelimit.ratelimit.period=1s"

volumes:
  pgdata:
  uploads:
